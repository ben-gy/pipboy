<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110" aria-label="Holotape — original homage">
  <defs>
    <style>
      .ink   { fill: currentColor; }
      .case  { fill: currentColor; opacity: 0.20; }
      .lbl   { fill: currentColor; opacity: 0.10; }
      .out   { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linejoin: round; }
      .out-thin { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Outer cassette shell -->
  <rect x="6" y="6" width="148" height="98" rx="4" class="case"/>
  <rect x="6" y="6" width="148" height="98" rx="4" class="out"/>

  <!-- Top label area -->
  <rect x="14" y="14" width="132" height="22" class="lbl"/>
  <rect x="14" y="14" width="132" height="22" class="out-thin"/>
  <text x="80" y="30" text-anchor="middle"
        font-family="ShareTechMono, monospace" font-size="11"
        fill="currentColor" letter-spacing="2">HOLOTAPE</text>

  <!-- Inner viewing window -->
  <rect x="20" y="44" width="120" height="40" class="ink"/>
  <rect x="22" y="46" width="116" height="36" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>

  <!-- Reels -->
  <g>
    <circle cx="46" cy="64" r="13" fill="currentColor" opacity="0.4"/>
    <circle cx="46" cy="64" r="13" class="out"/>
    <circle cx="46" cy="64" r="4" class="ink"/>
    <!-- spokes -->
    <line x1="46" y1="55" x2="46" y2="73" class="out-thin"/>
    <line x1="37" y1="64" x2="55" y2="64" class="out-thin"/>
    <line x1="40" y1="58" x2="52" y2="70" class="out-thin"/>
    <line x1="40" y1="70" x2="52" y2="58" class="out-thin"/>

    <circle cx="114" cy="64" r="13" fill="currentColor" opacity="0.4"/>
    <circle cx="114" cy="64" r="13" class="out"/>
    <circle cx="114" cy="64" r="4" class="ink"/>
    <line x1="114" y1="55" x2="114" y2="73" class="out-thin"/>
    <line x1="105" y1="64" x2="123" y2="64" class="out-thin"/>
    <line x1="108" y1="58" x2="120" y2="70" class="out-thin"/>
    <line x1="108" y1="70" x2="120" y2="58" class="out-thin"/>
  </g>

  <!-- Tape strip between reels -->
  <line x1="59" y1="64" x2="101" y2="64" class="out-thin"/>

  <!-- Bottom screw notches -->
  <circle cx="20" cy="94" r="2" class="ink"/>
  <circle cx="140" cy="94" r="2" class="ink"/>

  <!-- Side write-protect tab -->
  <rect x="6" y="44" width="4" height="10" class="ink"/>
  <rect x="150" y="44" width="4" height="10" class="ink"/>
</svg>
